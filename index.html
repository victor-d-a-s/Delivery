<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drop Entregas - App Oficial</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Ajustes Mobile */
        body { -webkit-tap-highlight-color: transparent; }
        #map { height: 350px; width: 100%; z-index: 0; border-radius: 12px; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff6b00;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-orange-500 text-white p-2 rounded-lg font-bold">DE</div>
            <h1 class="text-xl font-bold tracking-tight">Drop Entregas</h1>
        </div>
        <button id="btnLogin" onclick="fazerLogin()" class="text-sm bg-gray-900 text-white px-4 py-2 rounded-full font-medium active:scale-95 transition">
            Entrar
        </button>
        <div id="userInfo" class="hidden flex items-center gap-2">
            <span id="userEmail" class="text-xs text-gray-500 font-medium"></span>
            <button onclick="fazerLogout()" class="text-xs text-red-500 border border-red-100 px-2 py-1 rounded hover:bg-red-50">Sair</button>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-1 rounded-2xl shadow-sm border border-gray-100 relative">
            <div id="map"></div>
            <button onclick="centralizarMapa()" class="absolute bottom-4 right-4 z-[400] bg-white p-3 rounded-full shadow-lg text-gray-700 active:bg-gray-100">
                📍
            </button>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                📦 Novo Pedido
            </h2>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-500 uppercase ml-1">Retirada (Origem)</label>
                <div class="relative">
                    <input type="text" id="inputOrigem" placeholder="Detectando localização..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition" readonly>
                    <div class="absolute right-3 top-3 text-orange-500 animate-pulse text-xs font-bold" id="gpsStatus">GPS</div>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-500 uppercase ml-1">Entrega (Destino)</label>
                <input type="text" id="inputDestino" placeholder="Digite o endereço de entrega" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition shadow-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase ml-1">Nome Dest.</label>
                    <input type="text" id="nomeDest" placeholder="Ex: João" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase ml-1">Telefone</label>
                    <input type="tel" id="telDest" placeholder="(84) 9..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm">
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <label class="flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-lg border border-gray-100 flex-1 justify-center cursor-pointer active:bg-orange-50 transition select-none">
                    <input type="checkbox" id="checkRetorno" class="w-4 h-4 text-orange-600 rounded focus:ring-orange-500" onchange="calcularPrevia()">
                    <span class="text-xs font-medium text-gray-700">Com Retorno</span>
                </label>
                <select id="formaPagamento" class="bg-gray-50 border border-gray-100 text-gray-700 text-sm rounded-lg block p-2 flex-1 focus:ring-orange-500 focus:border-orange-500">
                    <option value="pix">Pix</option>
                    <option value="dinheiro">Dinheiro</option>
                    <option value="cartao">Cartão</option>
                </select>
            </div>
        </div>

        <div id="cardResumo" class="hidden bg-gray-900 text-white p-5 rounded-2xl shadow-lg transition-all duration-300">
            <div class="flex justify-between items-end">
                <div>
                    <p class="text-gray-400 text-xs uppercase font-bold mb-1">Total Estimado</p>
                    <div class="text-3xl font-bold tracking-tight flex items-baseline gap-1">
                        <span class="text-lg">R$</span>
                        <span id="valorDisplay">0,00</span>
                    </div>
                    <p class="text-gray-500 text-xs mt-1" id="distanciaDisplay">Calculando distância...</p>
                </div>
                <button onclick="confirmarPedido()" id="btnConfirmar" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg active:scale-95 transition flex items-center gap-2">
                    <span>Chamar Moto</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>
            </div>
        </div>
        
        <div id="statusMsg" class="hidden p-4 rounded-xl text-center text-sm font-medium"></div>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // CONFIGURAÇÃO DO SUPABASE (Sua Chave Pública)
        const SUPABASE_URL = 'https://tvhbumscbgvjrrpqgmwc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2aGJ1bXNjYmd2anJycHFZ213YyIsInJvbGUiOiJhbW9uIiwiaWF0IjoxNzM1NzY3OTg5LCJleHAiOjIwNTEzNDM5ODl9.4C_L_7F_t_6F_t_6F_t_6F_t_6F_t_6F_t_6F_t_6F_t_6'; // Coloque sua chave ANON KEY aqui se for diferente
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // VARIÁVEIS GLOBAIS
        let map, userMarker, routeLayer;
        let userLocation = null;
        let distKm = 0;

        // INICIALIZAÇÃO
        window.onload = async () => {
            initMap();
            checkUser();
            watchLocation();
        };

        // --- MAPA E GPS ---
        function initMap() {
            map = L.map('map').setView([-5.188, -37.344], 13); // Mossoró
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
        }

        function watchLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    userLocation = { lat, lng };

                    if (!userMarker) {
                        userMarker = L.marker([lat, lng], {
                            icon: L.divIcon({
                                className: 'bg-blue-500 w-4 h-4 rounded-full border-2 border-white shadow-lg',
                                iconSize: [16, 16]
                            })
                        }).addTo(map);
                        map.setView([lat, lng], 15);
                        document.getElementById('inputOrigem').value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        // Busca endereço reverso
                        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                            .then(r => r.json())
                            .then(d => {
                                if(d.address) document.getElementById('inputOrigem').value = `${d.address.road || ''}, ${d.address.suburb || ''}`;
                            });
                    } else {
                        userMarker.setLatLng([lat, lng]);
                    }
                }, (err) => console.error("Erro GPS", err), { enableHighAccuracy: true });
            }
        }

        function centralizarMapa() {
            if(userLocation) map.setView([userLocation.lat, userLocation.lng], 16);
        }
        // --- CÁLCULO DE ROTA SIMPLES ---
        document.getElementById('inputDestino').addEventListener('blur', async function() {
            const destino = this.value;
            if (destino.length > 5 && userLocation) {
                // Simulação de busca de coordenadas do destino (Nominatim)
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destino + ', Mossoró')}`);
                const data = await res.json();
                
                if (data && data.length > 0) {
                    const destLat = parseFloat(data[0].lat);
                    const destLon = parseFloat(data[0].lon);
                    
                    // Desenha linha reta simples para estimativa
                    if(routeLayer) map.removeLayer(routeLayer);
                    routeLayer = L.polyline([[userLocation.lat, userLocation.lng], [destLat, destLon]], {color: '#ff6b00', weight: 4}).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), {padding: [50,50]});

                    // Calcula Distância (Haversine simples)
                    const R = 6371; 
                    const dLat = (destLat - userLocation.lat) * Math.PI / 180;
                    const dLon = (destLon - userLocation.lng) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                              Math.cos(userLocation.lat * Math.PI / 180) * Math.cos(destLat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    distKm = R * c;

                    calcularPrevia();
                    document.getElementById('cardResumo').classList.remove('hidden');
                }
            }
        });

        function calcularPrevia() {
            // Lógica simples de preço: R$5 fixo + R$1.50 por Km
            let total = 5.0 + (distKm * 1.50);
            if (document.getElementById('checkRetorno').checked) total *= 1.2; // +20% se tiver retorno
            
            document.getElementById('valorDisplay').innerText = total.toFixed(2).replace('.', ',');
            document.getElementById('distanciaDisplay').innerText = `Distância aprox: ${distKm.toFixed(1)} km`;
        }

        // --- SISTEMA DE LOGIN ---
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                document.getElementById('btnLogin').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userEmail').innerText = user.email.split('@')[0];
            } else {
                document.getElementById('btnLogin').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
            }
        }

        async function fazerLogin() {
            const email = prompt("Digite seu email:");
            if (!email) return;
            const senha = prompt("Digite sua senha:");
            
            const { error } = await supabase.auth.signInWithPassword({ email, password: senha });
            if (error) alert("Erro: " + error.message);
            else {
                alert("Login realizado!");
                location.reload();
            }
        }

        async function fazerLogout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // --- ENVIAR PEDIDO (A CORREÇÃO DEFINITIVA) ---
        async function confirmarPedido() {
            const btn = document.getElementById('btnConfirmar');
            const msg = document.getElementById('statusMsg');
            
            // 1. Validações visuais
            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> Processando...';
            msg.classList.add('hidden');

            try {
                // 2. FORÇAR OBTENÇÃO DO USUÁRIO ATUAL (CORREÇÃO DO ERRO 79)
                // Não usamos variável cacheada. Pegamos na hora.
                const { data: { user } } = await supabase.auth.getUser();
                
                // Se não tiver user logado, passamos NULL (o banco já sabe lidar com isso agora)
                const userIdSeguro = user ? user.id : null; 

                console.log("Enviando ID Seguro:", userIdSeguro); // Para debug

                // 3. Montar o objeto para enviar
                const payload = {
                    p_user_id: userIdSeguro, // AQUI ESTAVA O PROBLEMA, AGORA ESTÁ BLINDADO
                    p_origem: document.getElementById('inputOrigem').value,
                    p_destino: document.getElementById('inputDestino').value,
                    p_distancia_km: distKm,
                    p_forma_pagamento: document.getElementById('formaPagamento').value,
                    p_nome_dest: document.getElementById('nomeDest').value,
                    p_tel_dest: document.getElementById('telDest').value,
                    p_tipo_logistica: 'moto',
                    p_com_retorno: document.getElementById('checkRetorno').checked
                };

                // 4. Chamar a função SQL (RPC)
                const { data, error } = await supabase.rpc('criar_pedido_seguro', payload);

                if (error) throw error;

                // Sucesso!
                msg.className = "p-4 rounded-xl text-center text-sm font-medium bg-green-100 text-green-700 block";
                msg.innerHTML = `✅ Pedido Enviado!<br>Código: <b>#${data.msg || 'Novo'}</b>`;
                
                // Limpar mapa e form
                if(routeLayer) map.removeLayer(routeLayer);
                document.getElementById('cardResumo').classList.add('hidden');
                document.getElementById('inputDestino').value = '';

            } catch (err) {
                console.error(err);
                msg.className = "p-4 rounded-xl text-center text-sm font-medium bg-red-100 text-red-700 block";
                msg.innerText = "Erro ao pedir: " + (err.message || err.error_description || "Tente novamente.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Chamar Moto</span><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>';
            }
        }
    </script>
</body>
</html>
