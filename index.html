<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Entregas</title>
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-primary { background-color: #1E40AF; color: white; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-left-color: #1E40AF; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toggle-checkbox:checked { transform: translateX(100%); border-color: #1E40AF; }
        .toggle-checkbox:checked + .toggle-label { background-color: #1E40AF; }
        .transition-all-300 { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <script>
        // --- SUAS CHAVES (JÁ CONFIGURADAS) ---
        const SUPABASE_URL = 'https://zblwwoqfnhmoexonuzbi.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpibHd3b3Fmbmhtb2V4b251emJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3ODcyMDgsImV4cCI6MjA4MDM2MzIwOH0.crZGeKTawenl8N6ajhceRKalXVsCq31RWmSlvO6LHVc';
        const SHEETMONKEY_URL = 'https://api.sheetmonkey.io/form/bjbGYT8y9RCwwAk71aqbLr'; 
        const MAKE_WEBHOOK_URL = ""; // Deixe vazio se não for usar recarga automática agora
        const NUMERO_ADMIN = "5584982005039";
        const CIDADE_FIXA = "Mossoró, Rio Grande do Norte, Brasil";
        const PRECO_BASE = 6.00; const PRECO_POR_KM = 1.80; const TAXA_RETORNO = 0.70; const TAXA_FIXA_CENTRAL = 0.50;

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let usuarioAtual = { nome: "", telefone: "", codigo: "", saldo: 0 };
        let distanciaFinal = 0; let valorFinal = 0;
    </script>

    <!-- TELA 1: BOAS-VINDAS -->
    <div id="screen-welcome" class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 text-center fade-in">
        <div class="mb-8">
            <div class="inline-block p-5 rounded-full bg-blue-50 text-blue-700 mb-4 shadow-sm"><i class="fas fa-box-open text-5xl"></i></div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Drop Entregas</h1>
            <p class="text-gray-500 text-sm">Logística rápida para seu negócio.</p>
        </div>
        <div class="space-y-4">
            <button onclick="showScreen('register')" class="w-full btn-primary font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-3"><i class="fas fa-store"></i> Cadastrar Estabelecimento</button>
            <button onclick="showScreen('login')" class="w-full bg-white border-2 border-blue-800 text-blue-800 font-bold py-4 rounded-xl shadow-sm flex items-center justify-center gap-3"><i class="fas fa-sign-in-alt"></i> Já tenho Código</button>
        </div>
    </div>

    <!-- TELA 2: CADASTRO -->
    <div id="screen-register" class="hidden bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 fade-in relative">
        <button onclick="showScreen('welcome')" class="absolute top-4 left-4 text-gray-400"><i class="fas fa-arrow-left text-xl"></i></button>
        <div class="text-center mb-6 mt-2"><h2 class="text-xl font-bold text-gray-800">Novo Parceiro</h2></div>
        <div class="space-y-4">
            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                <p class="text-[10px] uppercase font-bold text-blue-600 mb-2">Dados do Estabelecimento</p>
                <input type="text" id="reg-nome-loja" class="w-full bg-white border rounded-lg p-2 text-sm mb-2" placeholder="Nome Fantasia">
                <input type="text" id="reg-zap-loja" class="w-full bg-white border rounded-lg p-2 text-sm" placeholder="WhatsApp da Loja">
            </div>
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                <p class="text-[10px] uppercase font-bold text-gray-500 mb-2">Responsável</p>
                <input type="text" id="reg-nome-resp" class="w-full bg-white border rounded-lg p-2 text-sm mb-2" placeholder="Nome Completo">
                <input type="text" id="reg-zap-resp" class="w-full bg-white border rounded-lg p-2 text-sm" placeholder="WhatsApp Pessoal">
            </div>
            <button onclick="fazerCadastro()" id="btn-cadastrar" class="w-full btn-primary font-bold py-3 rounded-xl shadow-lg mt-2 flex justify-center items-center gap-2"><span>Gerar Código</span><div id="loading-cad" class="spinner hidden"></div></button>
        </div>
    </div>

    <!-- TELA 3: LOGIN (5 DÍGITOS) -->
    <div id="screen-login" class="hidden bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 fade-in relative">
        <button onclick="showScreen('welcome')" class="absolute top-4 left-4 text-gray-400"><i class="fas fa-arrow-left text-xl"></i></button>
        <div class="text-center mb-8 mt-4"><h2 class="text-xl font-bold text-gray-800">Acesso Drop</h2><p class="text-xs text-gray-500">Digite seu código de 5 dígitos.</p></div>
        <div class="space-y-4">
            <input type="text" id="login-codigo" class="w-full bg-blue-50 border border-blue-100 rounded-xl p-4 text-center text-2xl font-bold tracking-widest text-blue-800" placeholder="00000" maxlength="5">
            <button onclick="fazerLogin()" id="btn-login" class="w-full btn-primary font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-2"><span>Entrar</span><div id="loading-login" class="spinner hidden"></div></button>
            <p class="text-center text-xs text-blue-600 cursor-pointer hover:underline mt-2" onclick="alert('Fale com o suporte: ' + NUMERO_ADMIN)">Esqueci meu código</p>
        </div>
    <!-- TELA 4: O APP -->
    <div id="screen-app" class="hidden bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden fade-in relative">
        <div class="bg-blue-700 p-6 text-white relative">
            <div class="flex justify-between items-start relative z-10 mb-4">
                <div><p class="text-xs opacity-80">Olá, <span id="app-user-name">Loja</span></p><h1 class="font-bold text-lg">Drop Entregas ⚡</h1></div>
                <button onclick="location.reload()" class="text-xs bg-blue-800 px-3 py-1 rounded-full">Sair</button>
            </div>
            <div class="bg-white/10 p-4 rounded-xl relative z-10">
                <p class="text-xs text-blue-100 uppercase tracking-wider mb-1">Seu Saldo</p><p class="text-2xl font-bold text-white" id="display-saldo">R$ 0,00</p>
            </div>
        </div>
        <div class="p-5 space-y-4">
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-3">
                <input type="text" id="origem" placeholder="Retirada (Ex: Minha Loja)" class="w-full p-2 text-sm rounded-lg border">
                <input type="text" id="destino" placeholder="Entrega (Ex: Centro)" class="w-full p-2 text-sm rounded-lg border">
            </div>
            <div class="space-y-3">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1"><input type="text" id="numero" placeholder="Nº" class="w-full p-2 text-sm rounded-lg border"></div>
                    <div class="col-span-2"><input type="text" id="complemento" placeholder="Apto / Bloco" class="w-full p-2 text-sm rounded-lg border"></div>
                </div>
                <input type="text" id="referencia" placeholder="Ponto de Referência" class="w-full p-2 text-sm rounded-lg border">
                <div class="grid grid-cols-2 gap-2">
                    <select id="pagamento_entrega" class="w-full p-2 text-sm rounded-lg border"><option value="PIX">PIX</option><option value="Dinheiro">Dinheiro</option><option value="Carteira">Carteira</option></select>
                    <select id="pagamento_produto" class="w-full p-2 text-sm rounded-lg border"><option value="Já Pago">Já Pago</option><option value="Cartão">Cartão</option><option value="PIX">PIX</option><option value="Dinheiro">Dinheiro</option></select>
                </div>
                <div class="flex items-center gap-2 p-2 bg-white border rounded-lg">
                    <span class="text-sm">Com retorno?</span>
                    <input type="checkbox" id="retorno" class="toggle-checkbox">
                </div>
            </div>
            <button onclick="calcularDistancia()" id="btn-calcular" class="w-full btn-primary font-bold py-3 rounded-xl">Calcular Frete</button>
            <div id="resultado-box" class="hidden text-center py-2"><p class="font-bold text-green-700 text-xl">R$ <span id="valor-display">0,00</span></p></div>
            <button onclick="enviarParaCentral()" id="btn-enviar" class="hidden w-full bg-green-600 text-white font-bold py-3 rounded-xl">Confirmar Pedido</button>
        </div>
    </div>

    <script>
        $(document).ready(function(){ $('#reg-zap-loja').mask('(00) 00000-0000'); $('#reg-zap-resp').mask('(00) 00000-0000'); });
        function showScreen(id) { ['welcome', 'register', 'login', 'app'].forEach(s => document.getElementById('screen-'+s).classList.add('hidden')); document.getElementById('screen-'+id).classList.remove('hidden'); }

        // --- CADASTRO 5 DÍGITOS ---
        async function fazerCadastro() {
            const loja = document.getElementById('reg-nome-loja').value;
            const zapLoja = document.getElementById('reg-zap-loja').value;
            const resp = document.getElementById('reg-nome-resp').value;
            const zapResp = document.getElementById('reg-zap-resp').value;
            const btn = document.getElementById('btn-cadastrar');
            const load = document.getElementById('loading-cad');

            if(!loja || !zapLoja) { alert("Preencha os campos!"); return; }
            btn.disabled = true; load.classList.remove('hidden');

            try {
                // GERAÇÃO DE CÓDIGO 5 DÍGITOS (10000 a 99999)
                const novoCodigo = Math.floor(10000 + Math.random() * 90000).toString();
                const nomeCompleto = `${loja} (Resp: ${resp})`;

                const { error } = await supabase.from('clientes').insert([{ 
                    codigo_cliente: novoCodigo, nome: nomeCompleto, whatsapp: zapLoja, saldo: 0 
                }]);

                if(error) throw error;

                alert(`🎉 Cadastro Sucesso!\n\nSEU CÓDIGO: ${novoCodigo}\n\nAnote para entrar.`);
                document.getElementById('login-codigo').value = novoCodigo;
                showScreen('login');
            } catch (e) { console.error(e); alert("Erro no cadastro: " + e.message); } 
            finally { btn.disabled = false; load.classList.add('hidden'); }
        }

        // --- LOGIN ---
        async function fazerLogin() {
            const codigo = document.getElementById('login-codigo').value.trim();
            const btn = document.getElementById('btn-login');
            const load = document.getElementById('loading-login');

            if(codigo.length !== 5) { alert("O código deve ter 5 dígitos."); return; }
            btn.disabled = true; load.classList.remove('hidden');

            try {
                const { data, error } = await supabase.from('clientes').select('*').eq('codigo_cliente', codigo);
                
                if (data && data.length > 0) {
                    usuarioAtual = { nome: data[0].nome.split('(')[0].trim(), telefone: data[0].whatsapp, codigo: data[0].codigo_cliente, saldo: data[0].saldo };
                    document.getElementById('app-user-name').innerText = usuarioAtual.nome;
                    document.getElementById('display-saldo').innerText = usuarioAtual.saldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    document.getElementById('origem').value = usuarioAtual.nome;
                    
                    // Monitora saldo em tempo real
                    supabase.channel('custom-all-channel').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'clientes', filter: `codigo_cliente=eq.${codigo}` }, (payload) => {
                        usuarioAtual.saldo = payload.new.saldo;
                        document.getElementById('display-saldo').innerText = usuarioAtual.saldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    }).subscribe();

                    showScreen('app');
                } else { alert("Código não encontrado."); }
            } catch (e) { alert("Erro de conexão."); }
            finally { btn.disabled = false; load.classList.add('hidden'); }
        }

        // --- CÁLCULO E ENVIO (IGUAIS) ---
        async function calcularDistancia() {
            const origem = document.getElementById('origem').value;
            const destino = document.getElementById('destino').value;
            if(!origem || !destino) { alert("Preencha a Rota!"); return; }
            document.getElementById('btn-text').innerText = "Calculando...";
            
            try {
                const urlA = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(origem + ', ' + CIDADE_FIXA)}`;
                const urlB = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destino + ', ' + CIDADE_FIXA)}`;
                const [resA, resB] = await Promise.all([fetch(urlA), fetch(urlB)]);
                const [dataA, dataB] = await Promise.all([resA.json(), resB.json()]);

                if(!dataA.length || !dataB.length) { alert("Endereço não achado."); resetBotao(); return; }
                const dist = getDistanceFromLatLonInKm(dataA[0].lat, dataA[0].lon, dataB[0].lat, dataB[0].lon);
                distanciaFinal = (dist * 1.3).toFixed(1); if(distanciaFinal < 1) distanciaFinal = 1;
                
                if(distanciaFinal == 0) return;
                let preco = PRECO_BASE + (distanciaFinal * PRECO_POR_KM);
                if(document.getElementById('retorno').checked) preco += (preco * TAXA_RETORNO);
                valorFinal = preco.toFixed(2);

                document.getElementById('valor-display').innerText = valorFinal.replace('.', ',');
                document.getElementById('btn-calcular').classList.add('hidden');
                document.getElementById('resultado-box').classList.remove('hidden');
                document.getElementById('btn-enviar').classList.remove('hidden');
            } catch (e) { alert("Erro mapa."); resetBotao(); }
        }

        function resetBotao() { document.getElementById('btn-text').innerText = "Calcular Frete"; }
        
        async function enviarParaCentral() {
            const origem = document.getElementById('origem').value;
            const destino = document.getElementById('destino').value;
            const numero = document.getElementById('numero').value;
            const pagEntrega = document.getElementById('pagamento_entrega').value;
            
            if(!numero) { alert("Digite o número!"); return; }

            if(pagEntrega === "Carteira") {
                if(parseFloat(valorFinal) > usuarioAtual.saldo) { alert("Saldo insuficiente!"); return; }
                const novoSaldo = usuarioAtual.saldo - parseFloat(valorFinal);
                const { error } = await supabase.from('clientes').update({ saldo: novoSaldo }).eq('codigo_cliente', usuarioAtual.codigo);
                if(error) { alert("Erro débito: " + error.message); return; }
                usuarioAtual.saldo = novoSaldo;
            }

            try {
                // Salva Pedido no Supabase
                await supabase.from('pedidos').insert([{
                    cliente_id: usuarioAtual.codigo, nome_cliente: usuarioAtual.nome,
                    origem: origem, destino: destino, valor_frete: parseFloat(valorFinal),
                    forma_pagamento: pagEntrega, status: 'Solicitado'
                }]);

                // Salva na Planilha
                const dadosPlanilha = {
                    'Data': new Date().toLocaleString(), 'Cliente': usuarioAtual.nome,
                    'Telefone': usuarioAtual.telefone, 'Origem': origem, 'Destino': destino,
                    'Numero': numero, 'Valor': valorFinal, 'Pagamento': pagEntrega,
                    'x-sheetmonkey-insert-worksheet': 'Corridas'
                };
                fetch(SHEETMONKEY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dadosPlanilha) });

            } catch(e){}

            let valorMotoboy = parseFloat(valorFinal) - TAXA_FIXA_CENTRAL;
            if(valorMotoboy < 4) valorMotoboy = 4;
            let proto = valorMotoboy.toFixed(2).replace('.','');
            while(proto.length < 5) proto = "0" + proto;

            const msg = `🚨 *NOVA CORRIDA* 🚨%0A👤 ${usuarioAtual.nome}%0A📍 ${origem} -> ${destino} (${numero})%0A💰 ${pagEntrega}%0A💲 R$ ${valorFinal}%0A🔑 *Prot:* %23${proto}`;
            window.open(`https://wa.me/${NUMERO_ADMIN}?text=${msg}`, '_blank');
            location.reload();
        }

        function getDistanceFromLatLonInKm(lat1,lon1,lat2,lon2) { var R = 6371; var dLat = deg2rad(lat2-lat1); var dLon = deg2rad(lon2-lon1); var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c; }
        function deg2rad(deg) { return deg * (Math.PI/180); }
    </script>
