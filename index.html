<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Entregas - Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; }
        
        .spinner { border: 3px solid rgba(0, 0, 0, 0.1); border-left-color: #2563EB; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .toggle-checkbox { position: absolute; top: 0; left: 0; transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); }
        .toggle-checkbox:checked { transform: translateX(100%); border-color: #2563EB; }
        .toggle-checkbox:checked + .toggle-label { background-color: #2563EB; }
        .transition-all-300 { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
        
        <div class="bg-blue-700 p-6 text-white text-center relative overflow-hidden">
            <div class="absolute inset-0 opacity-20" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');"></div>
            <h1 class="font-bold text-2xl relative z-10">Flash Entregas ⚡</h1>
            <p class="text-xs opacity-90 relative z-10">Solicite sua coleta rápida em Mossoró</p>
        </div>

        <div class="p-5 space-y-4">
            
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="nome" class="w-full bg-gray-50 border rounded-lg p-3 text-sm outline-none focus:bg-white transition" placeholder="Seu Nome">
                <input type="text" id="telefone" class="w-full bg-gray-50 border rounded-lg p-3 text-sm outline-none focus:bg-white transition" placeholder="WhatsApp">
            </div>

            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-3">
                <p class="text-[10px] text-center text-blue-500 font-bold uppercase tracking-wider">📍 Rota (Para Calcular)</p>
                
                <div class="relative">
                    <i class="fas fa-map-marker-alt text-blue-600 absolute left-3 top-3"></i>
                    <input type="text" id="origem" placeholder="Buscar onde? (Bairro ou Rua)" class="pl-9 bg-white border w-full p-2 text-sm rounded-lg outline-none focus:border-blue-500">
                </div>

                <div class="relative">
                    <i class="fas fa-flag-checkered text-green-600 absolute left-3 top-3"></i>
                    <input type="text" id="destino" placeholder="Levar pra onde? (Bairro ou Rua)" class="pl-9 bg-white border w-full p-2 text-sm rounded-lg outline-none focus:border-green-500">
                </div>
                
                <button onclick="calcularDistancia()" class="w-full bg-blue-600 text-white text-sm font-bold py-3 rounded-lg hover:bg-blue-700 flex justify-center items-center gap-2 shadow-md active:scale-95 transition mt-2">
                    <span id="btn-text">Calcular Valor</span>
                    <div id="loading" class="spinner hidden"></div>
                </button>
            </div>

            <div id="detalhes-box" class="hidden space-y-3 bg-gray-50 p-3 rounded-xl border border-gray-200">
                <p class="text-[10px] text-center text-gray-500 font-bold uppercase tracking-wider">📝 Detalhes da Entrega</p>
                
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1">
                        <label class="text-[10px] text-gray-500 font-bold ml-1">Número</label>
                        <input type="text" id="numero" placeholder="Nº 123" class="bg-white border w-full p-2 text-sm rounded-lg outline-none focus:border-blue-500">
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] text-gray-500 font-bold ml-1">Complemento</label>
                        <input type="text" id="complemento" placeholder="Ex: Apto 102, Bloco C" class="bg-white border w-full p-2 text-sm rounded-lg outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 font-bold ml-1">Ponto de Referência</label>
                    <input type="text" id="referencia" placeholder="Ex: Próximo à Padaria..." class="bg-white border w-full p-2 text-sm rounded-lg outline-none focus:border-blue-500">
                </div>
            </div>

            <div id="resultado-box" class="hidden bg-green-50 border border-green-200 p-4 rounded-xl flex justify-between items-center animate-pulse">
                <div>
                    <p class="text-xs text-gray-500">Distância Estimada</p>
                    <p class="font-bold text-gray-800"><span id="km-display">0</span> km</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-500">Valor Frete</p>
                    <p class="font-bold text-2xl text-green-700">R$ <span id="valor-display">0,00</span></p>
                </div>
            </div>

            <div class="space-y-3">
                <div id="box-retorno" class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100 transition-all-300">
                    <div class="flex items-center gap-2">
                        <i id="icon-retorno" class="fas fa-arrow-right text-gray-400"></i>
                        <span id="text-retorno" class="text-sm font-bold text-gray-500">Com retorno?</span>
                    </div>
                    <div class="relative inline-block w-12 mr-2">
                        <input onchange="recalcularTotal(); mudarStatusRetorno()" type="checkbox" id="retorno" class="toggle-checkbox block w-6 h-6 rounded-full bg-white border-4 cursor-pointer border-gray-300"/>
                        <label for="retorno" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">Pgto Entrega</label>
                        <select id="pagamento_entrega" class="w-full bg-gray-50 border rounded-lg p-2 text-sm text-gray-700 outline-none focus:bg-white border-blue-300">
                            <option value="PIX">💠 PIX</option>
                            <option value="Dinheiro">💵 Dinheiro</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">Pgto Produto</label>
                        <select id="pagamento_produto" class="w-full bg-gray-50 border rounded-lg p-2 text-sm text-gray-700 outline-none focus:bg-white border-green-300">
                            <option value="Já Pago">✅ Já Pago</option>
                            <option value="Cartão">💳 Cartão</option>
                            <option value="PIX">💠 PIX</option>
                            <option value="Dinheiro">💵 Dinheiro</option>
                        </select>
                    </div>
                </div>
            </div>

            <button onclick="enviarParaCentral()" id="btn-enviar" class="hidden w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-700 flex justify-center items-center gap-2 transform active:scale-95 transition">
                <i class="fab fa-whatsapp text-2xl"></i> Solicitar Motoboy
            </button>
            
        </div>
    </div>

    <script>
        $(document).ready(function(){ $('#telefone').mask('(00) 00000-0000'); });

        // --- CONFIGURAÇÃO ---
        const CIDADE_FIXA = "Mossoró, Rio Grande do Norte, Brasil"; 
        const PRECO_BASE = 5.00;      
        const PRECO_POR_KM = 1.00;    
        const TAXA_RETORNO = 0.20;
        const TAXA_FIXA_CENTRAL = 1.00; 

        let distanciaFinal = 0;
        let valorFinal = 0;

        // 1. Busca Endereço
        async function calcularDistancia() {
            const origemInput = document.getElementById('origem').value;
            const destinoInput = document.getElementById('destino').value;

            if(!origemInput || !destinoInput) { alert("Preencha Origem e Destino!"); return; }

            document.getElementById('btn-text').innerText = "Calculando...";
            document.getElementById('loading').classList.remove('hidden');

            try {
                const buscaA = `${origemInput}, ${CIDADE_FIXA}`;
                const buscaB = `${destinoInput}, ${CIDADE_FIXA}`;

                const resA = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaA)}`);
                const dataA = await resA.json();
                
                const resB = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaB)}`);
                const dataB = await resB.json();

                if(dataA.length === 0 || dataB.length === 0) {
                    alert("Endereço não encontrado. Tente usar apenas o nome do Bairro.");
                    resetBotao();
                    return;
                }

                const dist = getDistanceFromLatLonInKm(dataA[0].lat, dataA[0].lon, dataB[0].lat, dataB[0].lon);
                distanciaFinal = (dist * 1.3).toFixed(1); 
                if(distanciaFinal < 1) distanciaFinal = 1;

                recalcularTotal();

                // Mostra campos de detalhes
                document.getElementById('resultado-box').classList.remove('hidden');
                document.getElementById('detalhes-box').classList.remove('hidden'); 
                document.getElementById('btn-enviar').classList.remove('hidden');
                document.getElementById('resultado-box').classList.remove('animate-pulse');
                
            } catch (error) {
                alert("Erro de conexão. Verifique sua internet.");
            }
            resetBotao();
        }

        // 2. Calcula Preço
        function recalcularTotal() {
            if(distanciaFinal == 0) return;
            let preco = PRECO_BASE + (distanciaFinal * PRECO_POR_KM);
            if(document.getElementById('retorno').checked) preco += (preco * TAXA_RETORNO);
            valorFinal = preco.toFixed(2);
            
            document.getElementById('km-display').innerText = distanciaFinal.replace('.', ',');
            document.getElementById('valor-display').innerText = valorFinal.replace('.', ',');
        }

        function mudarStatusRetorno() {
            const checked = document.getElementById('retorno').checked;
            const box = document.getElementById('box-retorno');
            const txt = document.getElementById('text-retorno');
            const ico = document.getElementById('icon-retorno');

            if(checked) {
                box.classList.replace('bg-gray-50', 'bg-blue-50'); box.classList.replace('border-gray-100', 'border-blue-200');
                txt.innerText = "Sim, com retorno"; txt.classList.replace('text-gray-500', 'text-blue-700');
                ico.className = "fas fa-exchange-alt text-blue-600";
            } else {
                box.classList.replace('bg-blue-50', 'bg-gray-50'); box.classList.replace('border-blue-200', 'border-gray-100');
                txt.innerText = "Precisa de retorno?"; txt.classList.replace('text-blue-700', 'text-gray-500');
                ico.className = "fas fa-arrow-right text-gray-400";
            }
        }

        // 4. Envio
        function enviarParaCentral() {
            const nome = document.getElementById('nome').value;
            const origem = document.getElementById('origem').value;
            const destino = document.getElementById('destino').value;
            
            // Detalhes
            const numero = document.getElementById('numero').value;
            const complemento = document.getElementById('complemento').value;
            const referencia = document.getElementById('referencia').value;
            
            // Pagamentos
            const pagEntrega = document.getElementById('pagamento_entrega').value;
            const pagProduto = document.getElementById('pagamento_produto').value;
            const retorno = document.getElementById('retorno').checked ? "COM RETORNO" : "SEM RETORNO";
            
            if(!nome || !numero) {
                alert("Preencha Nome e Número do local de entrega.");
                if(!numero) document.getElementById('numero').focus();
                return;
            }

            // Protocolo
            let valorTotalNumerico = parseFloat(valorFinal);
            let valorParaMotoboy = valorTotalNumerico - TAXA_FIXA_CENTRAL;
            if(valorParaMotoboy < 4.00) valorParaMotoboy = 4.00; 
            let textoValorMotoboy = valorParaMotoboy.toFixed(2);
            let codigoProtocolo = textoValorMotoboy.replace('.', ''); 
            while(codigoProtocolo.length < 5) { codigoProtocolo = "0" + codigoProtocolo; }

            const btn = document.getElementById('btn-enviar');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
            btn.disabled = true;

            const dadosParaPlanilha = {
                'Data': new Date().toLocaleString('pt-BR'),
                'Cliente': nome,
                'Telefone': document.getElementById('telefone').value,
                'Origem': origem,
                'Destino': destino,
                'Numero': numero,
                'Complemento': complemento,
                'Referencia': referencia,
                'Pgto_Entrega': pagEntrega,
                'Pgto_Produto': pagProduto,
                'Valor_Frete': valorFinal
            };

            const urlSheetMonkey = "https://api.sheetmonkey.io/form/SEU_CODIGO_AQUI"; 

            fetch(urlSheetMonkey, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosParaPlanilha)
            }).then(() => {
                
                const numAdmin = "5584982005039"; 
                
                // Mensagem formatada com todos os detalhes
                const msg = `🚨 *NOVA CORRIDA* 🚨%0A%0A` +
                            `👤 *Cliente:* ${nome}%0A` +
                            `📍 *DE:* ${origem}%0A` +
                            `🏁 *PARA:* ${destino}%0A` +
                            `🔢 *Nº:* ${numero} ${complemento ? '('+complemento+')' : ''}%0A` +
                            `🏛️ *Ref:* ${referencia}%0A` +
                            `--------------------------------%0A` +
                            `📏 ${distanciaFinal}km | 🔄 ${retorno}%0A` +
                            `🛵 *Pgto Entrega:* ${pagEntrega}%0A` +
                            `📦 *Pgto Produto:* ${pagProduto}%0A` +
                            `💲 *FRETE: R$ ${valorFinal}*%0A` +
                            `🔑 *Prot:* %23${codigoProtocolo}`;

                window.open(`https://wa.me/${numAdmin}?text=${msg}`, '_blank');
                btn.innerHTML = textoOriginal;
                btn.disabled = false;

            }).catch(erro => {
                const numAdmin = "5584982005039"; 
                window.open(`https://wa.me/${numAdmin}?text=ERRO NO SITE - PEDIDO MANUAL: ${nome}`, '_blank');
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            });
        }

        function resetBotao() { document.getElementById('btn-text').innerText = "Recalcular"; document.getElementById('loading').classList.add('hidden'); }
        function getDistanceFromLatLonInKm(lat1,lon1,lat2,lon2) { var R = 6371; var dLat = deg2rad(lat2-lat1); var dLon = deg2rad(lon2-lon1); var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c; }
        function deg2rad(deg) { return deg * (Math.PI/180); }
    </script>
</body>
</html>
