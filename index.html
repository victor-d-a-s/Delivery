<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drop Entregas - Motoboy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #111827; color: white; padding-bottom: 90px; }
        .card-pedido { background: #1F2937; border-radius: 16px; border: 1px solid #374151; overflow: hidden; margin-bottom: 16px; position: relative; }
        .btn-action { width: 100%; padding: 14px; font-weight: bold; border-radius: 12px; transition: 0.2s; }
        .btn-action:active { transform: scale(0.98); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1F2937; border-top: 1px solid #374151; display: flex; justify-content: space-around; padding: 12px 0; z-index: 50; max-width: 28rem; margin: 0 auto; }
        @media (min-width: 768px) { .app-container { max-width: 28rem; margin: auto; min-height: 100vh; background-color: #111827; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); } body { display: flex; justify-content: center; background: #000; } }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #6B7280; cursor: pointer; flex: 1; transition: 0.2s; }
        .nav-item.active { color: #10B981; font-weight: bold; transform: translateY(-2px); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .btn-gps { background: #374151; color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-left-color: #10B981; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="p-6 flex justify-between items-center bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
            <div>
                <h1 class="text-xl font-bold text-white">Radar</h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <p class="text-xs text-gray-400" id="status-conn">Online</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <p class="text-xs text-gray-400">Ganhos Hoje</p>
                    <p class="text-sm font-bold text-green-400">R$ <span id="ganhos-hoje">0,00</span></p>
                </div>
                <button onclick="fazerLogout()" class="bg-gray-800 p-2 rounded-full text-gray-400"><i class="fas fa-power-off"></i></button>
            </div>
        </div>

        <div class="p-4">
            
            <div id="tab-radar" class="fade-in space-y-4">
                <div id="radar-empty" class="hidden flex flex-col items-center justify-center py-20 text-center opacity-50">
                    <i class="fas fa-satellite-dish text-6xl mb-4 animate-pulse"></i>
                    <p class="text-sm">Procurando pedidos...</p>
                </div>
                <div id="radar-list"></div>
            </div>

            <div id="tab-entrega" class="hidden fade-in">
                <div id="entrega-empty" class="flex flex-col items-center justify-center py-20 text-center opacity-50">
                    <i class="fas fa-motorcycle text-6xl mb-4"></i>
                    <p class="text-sm">Você está livre!</p>
                    <button onclick="navegar('radar')" class="mt-4 text-green-400 font-bold text-sm">Buscar Corridas</button>
                </div>

                <div id="entrega-ativa" class="hidden space-y-4">
                    <div class="bg-blue-500/10 border border-blue-500/30 p-3 rounded-xl flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="bg-blue-500 text-black w-8 h-8 rounded-full flex items-center justify-center font-bold animate-pulse"><i class="fas fa-bolt"></i></div>
                            <div>
                                <p class="text-sm font-bold text-blue-400" id="status-texto">Em Progresso</p>
                                <p class="text-xs text-blue-300/70">Pedido #<span id="ativo-id">...</span></p>
                            </div>
                        </div>
                        <p class="text-xl font-bold text-white">R$ <span id="ativo-valor">0,00</span></p>
                    </div>

                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 relative">
                        <div class="absolute left-4 top-8 bottom-8 w-0.5 bg-gray-600"></div>
                        
                        <div class="flex gap-4 mb-6 relative">
                            <div class="w-3 h-3 rounded-full bg-blue-500 mt-1.5 shadow-[0_0_10px_#3B82F6]"></div>
                            <div class="flex-1">
                                <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">COLETA (LOJA)</p>
                                <p class="text-sm font-bold text-gray-200" id="ativo-origem">...</p>
                                <div class="mt-2 flex gap-2">
                                    <button onclick="abrirGps('origem')" class="btn-gps"><i class="fas fa-location-arrow"></i> Ir</button>
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-4 relative">
                            <div class="w-3 h-3 rounded-full bg-green-500 mt-1.5 shadow-[0_0_10px_#10B981]"></div>
                            <div class="flex-1">
                                <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">ENTREGA (CLIENTE)</p>
                                <p class="text-sm font-bold text-gray-200 mb-1" id="ativo-destino">...</p>
                                <p class="text-xs text-gray-400 mb-2" id="ativo-cliente">...</p>
                                <div class="flex gap-2">
                                    <button onclick="abrirGps('destino')" class="btn-gps"><i class="fas fa-location-arrow"></i> Ir</button>
                                    <button onclick="abrirZapCliente()" class="btn-gps bg-green-900 text-green-400"><i class="fab fa-whatsapp"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-gray-400">Cobrar do Cliente</p>
                            <p class="text-lg font-bold text-white" id="ativo-forma">...</p>
                        </div>
                    </div>

                    <div id="area-acoes">
                        </div>

                    <button onclick="cancelarEntrega()" class="w-full text-center text-xs text-red-500 py-2">Cancelar/Problema</button>
                </div>
            </div>

        </div>

        <div id="modal-login" class="fixed inset-0 bg-black z-[100] flex items-center justify-center p-6 hidden">
            <div class="w-full max-w-sm">
                <div class="text-center mb-10">
                    <i class="fas fa-helmet-safety text-6xl text-green-500 mb-4"></i>
                    <h1 class="text-3xl font-bold text-white">App Motoboy</h1>
                    <p class="text-gray-500 text-sm mt-2">Acesso restrito</p>
                </div>
                <input type="email" id="login-email" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-white mb-3" placeholder="E-mail">
                <input type="password" id="login-senha" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-white mb-6" placeholder="Senha">
                <button onclick="fazerLogin()" id="btn-login" class="w-full bg-green-600 font-bold text-white py-4 rounded-xl flex justify-center gap-2"><span>ENTRAR</span><div id="load-login" class="spinner hidden"></div></button>
            </div>
        </div>

        <div id="modal-pin" class="hidden fixed inset-0 bg-black/90 z-[80] flex items-center justify-center p-6 fade-in">
            <div class="bg-gray-800 w-full max-w-xs p-6 rounded-2xl border border-gray-700 text-center">
                <h3 class="text-lg font-bold text-white mb-2">Validar Entrega</h3>
                <p class="text-sm text-gray-400 mb-6">Peça o código PIN ao cliente</p>
                
                <input type="tel" id="input-pin" maxlength="4" class="w-full bg-gray-900 border border-gray-600 rounded-xl p-4 text-center text-3xl font-bold tracking-[0.5em] text-white mb-6 focus:border-green-500 outline-none" placeholder="0000">
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="document.getElementById('modal-pin').classList.add('hidden')" class="bg-gray-700 text-white font-bold py-3 rounded-xl">Voltar</button>
                    <button onclick="validarPin()" class="bg-green-600 text-white font-bold py-3 rounded-xl">Confirmar</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" id="nav-radar" onclick="navegar('radar')">
                <i class="fas fa-map-marked-alt"></i><span>Radar</span>
            </div>
            <div class="nav-item" id="nav-entrega" onclick="navegar('entrega')">
                <i class="fas fa-box"></i><span>Entrega</span>
            </div>
            <div class="nav-item" onclick="alert('Histórico em breve')">
                <i class="fas fa-history"></i><span>Ganhos</span>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://ofpnnijkhgsjarixoyhg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mcG5uaWpraGdzamFyaXhveWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNjUyNzYsImV4cCI6MjA4MDY0MTI3Nn0.dNOIIETmTz3l1HvhuT-ihAiymJqiaYZnklzzBzDGCFU';

        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let userSession = null;
        let pedidoAtual = null;

        // INICIALIZAÇÃO
        window.onload = async function() {
            const { data: { session } } = await sbClient.auth.getSession();
            
            if (session) {
                userSession = session;
                const { data: perfil } = await sbClient.from('profiles').select('funcao').eq('id', session.user.id).single();

                if (perfil && perfil.funcao === 'motoboy') {
                    document.getElementById('modal-login').classList.add('hidden');
                    iniciarApp();
                } else {
                    alert("Acesso Negado: Painel exclusivo para entregadores.");
                    await sbClient.auth.signOut();
                    location.reload();
                }
            } else {
                document.getElementById('modal-login').classList.remove('hidden');
            }
        };

        async function fazerLogin() {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            const btn = document.getElementById('btn-login');
            const loader = document.getElementById('load-login');

            if(!email || !senha) return alert("Preencha todos os campos");
            btn.disabled = true; loader.classList.remove('hidden');

            try {
                const { data, error } = await sbClient.auth.signInWithPassword({ email, password: senha });
                if (error) throw error;

                const { data: perfil } = await sbClient.from('profiles').select('funcao').eq('id', data.user.id).single();
                if (perfil && perfil.funcao === 'motoboy') location.reload();
                else throw new Error("Acesso não autorizado.");

            } catch (e) {
                alert("Erro: " + e.message);
                if (e.message.includes("não autorizado")) await sbClient.auth.signOut();
            } finally {
                btn.disabled = false; loader.classList.add('hidden');
            }
        }

        async function fazerLogout() { await sbClient.auth.signOut(); location.reload(); }

        function iniciarApp() {
            verificarPedidoAtivo();
            carregarRadar();
            
            // REALTIME: Ouve pedidos 'solicitado' para o Radar
            sbClient.channel('radar-motoboy')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, payload => {
                carregarRadar(); // Atualiza radar se entrar pedido novo
                // Se o pedido atual mudou (ex: cliente cancelou), atualiza tela
                if(pedidoAtual && payload.new.id === pedidoAtual.id) verificarPedidoAtivo();
            })
            .subscribe();
        }

        // --- RADAR ---
        async function carregarRadar() {
            // Só mostra pedidos 'solicitado'
            const { data } = await sbClient.from('pedidos')
                .select('*')
                .eq('status', 'solicitado') 
                .order('created_at', { ascending: false });
            
            document.getElementById('radar-list').innerHTML = '';
            if(data && data.length > 0) {
                data.forEach(p => adicionarCardRadar(p));
                document.getElementById('radar-empty').classList.add('hidden');
            } else {
                document.getElementById('radar-empty').classList.remove('hidden');
            }
        }

        function adicionarCardRadar(pedido) {
            const html = `
                <div id="card-${pedido.id}" class="card-pedido p-4 animate-pulse-once">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center gap-2">
                            <div class="bg-gray-700 p-2 rounded-lg"><i class="fas fa-store text-blue-400"></i></div>
                            <div>
                                <p class="text-sm font-bold text-gray-200 line-clamp-1">${pedido.origem}</p>
                                <p class="text-xs text-gray-500">Coleta</p>
                            </div>
                        </div>
                        <span class="bg-green-500/20 text-green-400 px-2 py-1 rounded text-xs font-bold">R$ ${pedido.valor_frete.toFixed(2)}</span>
                    </div>
                    <div class="pl-2 border-l-2 border-gray-700 ml-3 mb-3">
                        <p class="text-sm text-gray-300 line-clamp-1">${pedido.destino}</p>
                        <p class="text-xs text-gray-500">Entrega</p>
                    </div>
                    <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-700">
                        <span class="text-xs text-gray-400 bg-gray-800 px-2 py-1 rounded">${pedido.forma_pagamento}</span>
                        <button onclick="aceitarPedido('${pedido.id}')" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-lg text-sm font-bold transition-colors">ACEITAR</button>
                    </div>
                </div>
            `;
            document.getElementById('radar-list').insertAdjacentHTML('beforeend', html);
        }

        // --- AÇÕES DO MOTOBOY (FLUXO DE STATUS) ---
        
        // 1. ACEITAR (solicitado -> pendente)
        async function aceitarPedido(id) {
            if(!confirm("Aceitar esta corrida?")) return;
            
            const { error } = await sbClient.from('pedidos')
                .update({ status: 'pendente', entregador_id: userSession.user.id })
                .eq('id', id)
                .eq('status', 'solicitado'); // Garante que ninguém pegou antes

            if (error) {
                alert("Erro: Alguém pode ter pego antes.");
                carregarRadar();
            } else {
                verificarPedidoAtivo(); 
            }
        }

        // 2. COLETAR (pendente -> em_rota)
        async function coletarPedido() {
            if(!confirm("Confirma que retirou o pacote na loja?")) return;
            await sbClient.from('pedidos').update({ status: 'em_rota' }).eq('id', pedidoAtual.id);
            verificarPedidoAtivo();
        }

        // 3. FINALIZAR (em_rota -> concluido) - Requer PIN
        function abrirModalPin() {
            document.getElementById('input-pin').value = '';
            document.getElementById('modal-pin').classList.remove('hidden');
            document.getElementById('input-pin').focus();
        }

        async function validarPin() {
            const pinDigitado = document.getElementById('input-pin').value;
            const { data } = await sbClient.from('pedidos').select('id').eq('id', pedidoAtual.id).eq('pin_entrega', pinDigitado).single();

            if (data) {
                await sbClient.from('pedidos').update({ status: 'concluido' }).eq('id', pedidoAtual.id);
                alert("Entrega Concluída! R$ " + pedidoAtual.valor_frete.toFixed(2) + " creditado.");
                document.getElementById('modal-pin').classList.add('hidden');
                verificarPedidoAtivo();
                
                const atual = parseFloat(document.getElementById('ganhos-hoje').innerText.replace(',','.'));
                document.getElementById('ganhos-hoje').innerText = (atual + pedidoAtual.valor_frete).toFixed(2).replace('.', ',');
            } else {
                alert("PIN Incorreto! Tente novamente.");
            }
        }

        // --- GESTÃO DE ESTADO DO PEDIDO ---
        async function verificarPedidoAtivo() {
            // Busca pedido que NÃO esteja concluído nem solicitado (ou seja, pendente ou em_rota)
            const { data } = await sbClient.from('pedidos')
                .select('*')
                .eq('entregador_id', userSession.user.id)
                .neq('status', 'concluido') 
                .maybeSingle();

            if (data) {
                pedidoAtual = data;
                renderizarEntregaAtiva(data);
                navegar('entrega');
            } else {
                pedidoAtual = null;
                document.getElementById('entrega-ativa').classList.add('hidden');
                document.getElementById('entrega-empty').classList.remove('hidden');
            }
        }

        function renderizarEntregaAtiva(pedido) {
            document.getElementById('entrega-empty').classList.add('hidden');
            document.getElementById('entrega-ativa').classList.remove('hidden');
            
            document.getElementById('ativo-id').innerText = pedido.id.toString().slice(0,4);
            document.getElementById('ativo-valor').innerText = pedido.valor_frete.toFixed(2);
            document.getElementById('ativo-origem').innerText = pedido.origem;
            document.getElementById('ativo-destino').innerText = pedido.destino;
            document.getElementById('ativo-cliente').innerText = `${pedido.nome_destinatario} • ${pedido.telefone_destinatario}`;
            document.getElementById('ativo-forma').innerText = pedido.forma_pagamento;

            // Lógica do Botão Principal baseada no Status
            const areaAcoes = document.getElementById('area-acoes');
            const statusTexto = document.getElementById('status-texto');
            
            if(pedido.status === 'pendente') {
                statusTexto.innerText = "Indo para Loja";
                areaAcoes.innerHTML = `
                    <button onclick="coletarPedido()" class="btn-action bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/50">
                        <i class="fas fa-box-open mr-2"></i> CONFIRMAR COLETA
                    </button>
                    <p class="text-xs text-center text-gray-500 mt-2">Clique ao pegar o pacote na loja</p>
                `;
            } else if (pedido.status === 'em_rota') {
                statusTexto.innerText = "Indo para Cliente";
                areaAcoes.innerHTML = `
                    <button onclick="abrirModalPin()" class="btn-action bg-green-600 hover:bg-green-500 text-white shadow-lg shadow-green-900/50">
                        <i class="fas fa-check-circle mr-2"></i> FINALIZAR ENTREGA
                    </button>
                    <p class="text-xs text-center text-gray-500 mt-2">Peça o PIN ao cliente</p>
                `;
            }
        }

        async function cancelarEntrega() {
            if(!confirm("Deseja cancelar esta entrega? Isso afetará sua reputação.")) return;
            await sbClient.from('pedidos').update({ status: 'solicitado', entregador_id: null }).eq('id', pedidoAtual.id);
            verificarPedidoAtivo();
            alert("Entrega cancelada e devolvida ao radar.");
        }

        function navegar(tab) {
            document.getElementById('tab-radar').classList.add('hidden');
            document.getElementById('tab-entrega').classList.add('hidden');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.remove('hidden');
            document.getElementById('nav-'+tab).classList.add('active');
        }

        function abrirGps(tipo) {
            const end = tipo === 'origem' ? pedidoAtual.origem : pedidoAtual.destino;
            window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(end)}`, '_blank');
        }

        function abrirZapCliente() {
            let tel = pedidoAtual.telefone_destinatario.replace(/\D/g, '');
            if(!tel.startsWith('55')) tel = '55' + tel;
            window.open(`https://wa.me/${tel}`, '_blank');
        }
    </script>
</body>
</html>
