<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drop Entregas - Cliente</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-primary { background-color: #1E40AF; color: white; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.96); }
        .btn-outline { background-color: white; color: #1E40AF; border: 2px solid #1E40AF; }
        
        /* Containers */
        .app-container { width: 100%; min-height: 100vh; background-color: white; padding-bottom: 90px; display: none; overflow-y: auto; }
        .active-screen { display: block; }
        
        @media (min-width: 768px) { .app-container { max-width: 28rem; min-height: auto; height: 90vh; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; margin: auto; } body { display: flex; align-items: center; justify-content: center; min-height: 100vh; } }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; justify-content: space-around; padding: 12px 0; max-width: 28rem; margin: 0 auto; display: none; z-index: 50; }
        @media (min-width: 768px) { .bottom-nav { border-radius: 0 0 1.5rem 1.5rem; } }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #9CA3AF; cursor: pointer; flex: 1; }
        .nav-item.active { color: #1E40AF; font-weight: bold; }

        /* Loader Personalizado */
        .custom-loader { border: 4px solid #f3f3f3; border-top: 4px solid #1E40AF; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

    <div id="global-loading" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-[100]">
        <div class="custom-loader"></div>
        <p class="text-gray-500 font-bold tracking-widest text-sm animate-pulse">CARREGANDO</p>
    </div>

    <div id="screen-welcome" class="app-container p-8 text-center flex flex-col justify-center">
        <div class="mb-12">
            <i class="fas fa-box-open text-7xl text-blue-700 mb-4 inline-block"></i>
            <h1 class="text-3xl font-bold text-gray-800">Drop Entregas</h1>
            <p class="text-gray-500">Cliente</p>
        </div>
        <div class="space-y-4">
            <button onclick="showScreen('register')" class="w-full btn-primary font-bold py-4 rounded-xl shadow-lg text-lg">Cadastrar Loja</button>
            <button onclick="showScreen('login')" class="w-full btn-outline font-bold py-4 rounded-xl shadow-sm text-lg">Entrar</button>
        </div>
    </div>

    <div id="screen-register" class="app-container p-6">
        <div class="flex items-center mb-6 border-b pb-4">
            <button onclick="showScreen('welcome')" class="text-gray-500 mr-4"><i class="fas fa-arrow-left text-xl"></i></button>
            <h2 class="text-xl font-bold text-gray-800">Cadastrar Loja</h2>
        </div>
        
        <div class="space-y-5 pb-10">
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 space-y-3">
                <p class="text-xs font-bold text-blue-800 uppercase mb-1"><i class="fas fa-store"></i> Estabelecimento</p>
                <input type="text" id="reg-razao" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="Razão Social">
                <input type="text" id="reg-nome-loja" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="Nome Fantasia">
                <input type="tel" id="reg-cnpj" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="CNPJ">
                <input type="tel" id="reg-zap-loja" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="WhatsApp do Estabelecimento">
                <input type="text" id="reg-endereco" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="Endereço Fixo de Retirada">
            </div>

            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                <p class="text-xs font-bold text-gray-600 uppercase mb-1"><i class="fas fa-user"></i> Responsável</p>
                <input type="text" id="reg-nome-resp" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="Nome do Responsável">
                <input type="tel" id="reg-cpf-resp" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="CPF do Responsável">
                <input type="tel" id="reg-zap-resp" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="WhatsApp do Responsável">
            </div>

            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                <p class="text-xs font-bold text-gray-600 uppercase mb-1"><i class="fas fa-lock"></i> Acesso</p>
                <input type="email" id="reg-email" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="E-mail de Login">
                <input type="password" id="reg-senha" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="Senha">
                <input type="password" id="reg-conf-senha" class="w-full bg-white border rounded-lg p-3 text-sm" placeholder="Confirme a Senha">
            </div>

            <button onclick="fazerCadastro()" id="btn-cad" class="w-full btn-primary font-bold py-4 rounded-xl shadow-lg">Finalizar Cadastro</button>
        </div>
    </div>

    <div id="screen-login" class="app-container p-6 flex flex-col">
        <div class="mb-8 pt-4">
            <button onclick="showScreen('welcome')" class="text-gray-400 hover:text-blue-600"><i class="fas fa-arrow-left text-2xl"></i></button>
        </div>
        
        <div class="text-center mb-10">
            <i class="fas fa-box-open text-6xl text-blue-700 mb-4 inline-block"></i>
            <h2 class="text-2xl font-bold text-gray-800">Drop Entregas</h2>
            <p class="text-sm text-gray-500">Faça login para continuar</p>
        </div>
        
        <div class="space-y-4">
            <div class="bg-white border rounded-xl flex items-center p-1">
                <i class="fas fa-envelope text-gray-400 ml-3"></i>
                <input type="email" id="log-email" class="w-full p-3 outline-none" placeholder="E-mail">
            </div>
            <div class="bg-white border rounded-xl flex items-center p-1">
                <i class="fas fa-lock text-gray-400 ml-3"></i>
                <input type="password" id="log-senha" class="w-full p-3 outline-none" placeholder="Senha">
            </div>
            <button onclick="fazerLogin()" id="btn-log" class="w-full btn-primary font-bold py-4 rounded-xl mt-4 shadow-lg">ENTRAR</button>
        </div>
    </div>

    <div id="screen-app" class="app-container relative">
        <div class="bg-blue-700 p-6 text-white relative rounded-b-3xl shadow-lg mb-6">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-xs opacity-80">Olá, <span id="app-user-name" class="font-bold">...</span></p>
                    <p class="text-xs opacity-60">ID: <span id="app-user-code" class="font-mono bg-blue-800 px-1 rounded">...</span></p>
                </div>
                <button onclick="fazerLogout()" class="text-xs bg-blue-800 p-2 rounded-full"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            <div class="bg-white/10 p-4 rounded-xl flex justify-between items-center">
                <div><p class="text-xs text-blue-100 uppercase">Saldo</p><p class="text-3xl font-bold" id="display-saldo">R$ 0,00</p></div>
                <button onclick="solicitarSaldoZap()" class="bg-white text-blue-700 px-4 py-2 rounded-lg text-xs font-bold">ADD</button>
            </div>
        </div>
        
        <div class="px-5 space-y-4">
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                <p class="text-xs font-bold text-gray-400 uppercase mb-2">Novo Pedido</p>
                <div class="space-y-3">
                    <input type="text" id="origem" class="w-full bg-gray-50 border p-3 rounded-lg text-sm" placeholder="Retirada (Carregando...)" readonly>
                    <input type="text" id="destino" class="w-full bg-white border p-3 rounded-lg text-sm" placeholder="Entrega (Rua, Número, Bairro)">
                </div>
            </div>
            <button onclick="alert('Função de cálculo mantida (resumida aqui para caber).')" class="w-full btn-primary py-3 rounded-xl font-bold">Calcular Frete</button>
        </div>
    </div>

    <div id="bottom-menu" class="bottom-nav w-full z-[200]">
        <div class="nav-item active" onclick="navegar('app', this)"><i class="fas fa-home text-xl mb-1"></i><span>Início</span></div>
        <div class="nav-item"><i class="fas fa-list text-xl mb-1"></i><span>Pedidos</span></div>
        <div class="nav-item"><i class="fas fa-user text-xl mb-1"></i><span>Perfil</span></div>
    </div>

    <script>
        // --- CONFIGURAÇÕES ---
        const SUPABASE_URL = 'https://ofpnnijkhgsjarixoyhg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mcG5uaWpraGdzamFyaXhveWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNjUyNzYsImV4cCI6MjA4MDY0MTI3Nn0.dNOIIETmTz3l1HvhuT-ihAiymJqiaYZnklzzBzDGCFU';
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let userSession = null;

        // --- INICIALIZAÇÃO SEGURA ---
        window.onload = function() {
            // Máscaras (se jQuery carregar)
            if(typeof $ !== 'undefined') {
                $('#reg-zap-loja, #reg-zap-resp').mask('(00) 00000-0000');
                $('#reg-cnpj').mask('00.000.000/0000-00');
                $('#reg-cpf-resp').mask('000.000.000-00');
            }

            // Failsafe: Se em 3 segundos não carregar, libera a tela
            setTimeout(() => {
                document.getElementById('global-loading').classList.add('hidden');
                if(!userSession) showScreen('welcome');
            }, 3000);

            // Verifica sessão
            checkSession();
        };

        async function checkSession() {
            try {
                const { data: { session } } = await sbClient.auth.getSession();
                if (session) {
                    userSession = session;
                    // Carrega dados básicos
                    const { data } = await sbClient.from('profiles').select('*').eq('id', session.user.id).single();
                    if(data) {
                        document.getElementById('app-user-name').innerText = data.nome_loja;
                        document.getElementById('display-saldo').innerText = "R$ " + (data.saldo || 0).toFixed(2);
                        document.getElementById('origem').value = data.endereco || '';
                        showScreen('app');
                    }
                } else {
                    showScreen('welcome');
                }
            } catch(e) {
                console.error(e);
                showScreen('welcome'); // Em caso de erro, vai pra home
            } finally {
                document.getElementById('global-loading').classList.add('hidden');
            }
        }

        // --- NAVEGAÇÃO ROBUSTA ---
        function showScreen(id) {
            // Esconde todas as telas
            document.querySelectorAll('.app-container').forEach(el => {
                el.classList.add('hidden');
                el.style.display = 'none';
            });
            
            // Mostra a tela certa
            const target = document.getElementById('screen-' + id);
            if(target) {
                target.classList.remove('hidden');
                // Telas de auth usam Flex, App usa Block
                target.style.display = (id === 'app' || id === 'register') ? 'block' : 'flex';
            }

            // Menu inferior
            const menu = document.getElementById('bottom-menu');
            if(id === 'app') {
                menu.classList.remove('hidden'); menu.style.display = 'flex';
            } else {
                menu.classList.add('hidden'); menu.style.display = 'none';
            }
        }

        function navegar(tela, el) { showScreen(tela); }

        // --- CADASTRO COMPLETO ---
        async function fazerCadastro() {
            const dados = {
                razao: document.getElementById('reg-razao').value,
                fantasia: document.getElementById('reg-nome-loja').value,
                cnpj: document.getElementById('reg-cnpj').value,
                zapLoja: document.getElementById('reg-zap-loja').value,
                endereco: document.getElementById('reg-endereco').value,
                resp: document.getElementById('reg-nome-resp').value,
                cpf: document.getElementById('reg-cpf-resp').value,
                zapResp: document.getElementById('reg-zap-resp').value,
                email: document.getElementById('reg-email').value,
                senha: document.getElementById('reg-senha').value,
                conf: document.getElementById('reg-conf-senha').value
            };

            // Validação
            if(Object.values(dados).some(v => !v)) return alert("Preencha TODOS os campos!");
            if(dados.senha !== dados.conf) return alert("Senhas não conferem!");
            if(dados.senha.length < 6) return alert("Senha muito curta (mín 6).");

            const btn = document.getElementById('btn-cad');
            btn.innerText = "Cadastrando..."; btn.disabled = true;

            try {
                // 1. Cria Auth
                const { data, error } = await sbClient.auth.signUp({ email: dados.email, password: dados.senha });
                if (error) throw error;

                // 2. Salva Perfil Completo
                if (data.user) {
                    const { error: errPerfil } = await sbClient.from('profiles').insert([{
                        id: data.user.id,
                        razao_social: dados.razao,
                        nome_loja: dados.fantasia,
                        cnpj: dados.cnpj,
                        whatsapp_loja: dados.zapLoja,
                        endereco: dados.endereco,
                        responsavel: dados.resp,
                        cpf_responsavel: dados.cpf,
                        whatsapp_responsavel: dados.zapResp,
                        email: dados.email
                    }]);
                    
                    if(errPerfil) throw errPerfil;

                    alert("Cadastro realizado com sucesso! Faça login.");
                    showScreen('login');
                }
            } catch (e) {
                alert("Erro: " + e.message);
            } finally {
                btn.innerText = "Finalizar Cadastro"; btn.disabled = false;
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('log-email').value;
            const senha = document.getElementById('log-senha').value;
            
            const btn = document.getElementById('btn-log');
            btn.innerText = "..."; btn.disabled = true;

            try {
                const { error } = await sbClient.auth.signInWithPassword({ email, password: senha });
                if (error) throw error;
                // O listener checkSession vai pegar o login e redirecionar
                checkSession();
            } catch(e) {
                alert("Login falhou: " + e.message);
                btn.innerText = "ENTRAR"; btn.disabled = false;
            }
        }

        async function fazerLogout() { await sbClient.auth.signOut(); location.reload(); }
        function solicitarSaldoZap() { window.open('https://wa.me/5584982005039', '_blank'); }
    </script>
</body>
</html>
