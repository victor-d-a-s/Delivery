<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Entregas - Mossoró</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; }
        
        /* Spinner de Carregamento */
        .spinner { border: 3px solid rgba(0, 0, 0, 0.1); border-left-color: #2563EB; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Animação do Botão de Retorno (Slide) */
        .toggle-checkbox {
            position: absolute; top: 0; left: 0;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        .toggle-checkbox:checked {
            transform: translateX(100%);
            border-color: #2563EB;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #2563EB;
        }
        .transition-all-300 { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
        
        <div class="bg-blue-600 p-6 text-white text-center relative overflow-hidden">
            <div class="absolute inset-0 opacity-20" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');"></div>
            <h1 class="font-bold text-2xl relative z-10">Flash Entregas ⚡</h1>
            <p class="text-xs opacity-90 relative z-10">Entregas em Mossoró e Região</p>
        </div>

        <div class="p-5 space-y-4">
            
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-1">
                    <input type="text" id="nome" class="w-full bg-gray-50 border rounded-lg p-2 text-sm outline-none focus:bg-white transition" placeholder="Seu Nome">
                </div>
                <div class="col-span-1">
                    <input type="text" id="telefone" class="w-full bg-gray-50 border rounded-lg p-2 text-sm outline-none focus:bg-white transition" placeholder="WhatsApp">
                </div>
            </div>

            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 space-y-3">
                <p class="text-[10px] text-center text-blue-500 font-bold uppercase">Cidade Fixa: Mossoró/RN 📍</p>
                
                <div class="relative">
                    <i class="fas fa-circle text-[8px] text-blue-600 absolute left-3 top-3"></i>
                    <input type="text" id="origem" placeholder="Rua de Retirada (Bairro Opcional)" class="pl-8 bg-white border w-full p-2 text-sm rounded-lg outline-none focus:border-blue-500">
                </div>
                <div class="relative">
                    <i class="fas fa-square text-[8px] text-black absolute left-3 top-3"></i>
                    <input type="text" id="destino" placeholder="Rua de Entrega (Bairro Opcional)" class="pl-8 bg-white border w-full p-2 text-sm rounded-lg outline-none focus:border-black">
                </div>
                
                <button onclick="calcularDistancia()" class="w-full bg-blue-600 text-white text-sm font-bold py-2 rounded-lg hover:bg-blue-700 flex justify-center items-center gap-2 transition transform active:scale-95">
                    <span id="btn-text">Calcular Valor da Entrega</span>
                    <div id="loading" class="spinner hidden"></div>
                </button>
            </div>

            <div id="resultado-box" class="hidden bg-green-50 border border-green-200 p-4 rounded-xl flex justify-between items-center animate-pulse">
                <div>
                    <p class="text-xs text-gray-500">Distância Estimada</p>
                    <p class="font-bold text-gray-800"><span id="km-display">0</span> km</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-500">Valor Total</p>
                    <p class="font-bold text-2xl text-green-700">R$ <span id="valor-display">0,00</span></p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-3">
                
                <div id="box-retorno" class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100 transition-all-300">
                    <div class="flex items-center gap-2">
                        <i id="icon-retorno" class="fas fa-arrow-right text-gray-400 transition-colors duration-300"></i>
                        <span id="text-retorno" class="text-sm font-bold text-gray-500 transition-colors duration-300">Precisa de retorno?</span>
                    </div>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none">
                        <input onchange="recalcularTotal(); mudarStatusRetorno()" type="checkbox" id="retorno" class="toggle-checkbox block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300"/>
                        <label for="retorno" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Forma de Pagamento</label>
                    <select id="pagamento" class="w-full bg-gray-50 border rounded-lg p-3 text-sm text-gray-700 outline-none focus:bg-white focus:border-blue-500 transition">
                        <option value="PIX">💠 PIX (Transferência)</option>
                        <option value="Dinheiro">💵 Dinheiro (Espécie)</option>
                    </select>
                </div>
            </div>

            <button onclick="enviarPedido()" id="btn-enviar" class="hidden w-full bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-green-700 flex justify-center items-center gap-2 transform active:scale-95 transition">
                <i class="fab fa-whatsapp text-xl"></i> Chamar Motoboy Agora
            </button>
            
        </div>
    </div>

    <script>
        // Configuração de Máscara e Variáveis
        $(document).ready(function(){ $('#telefone').mask('(00) 00000-0000'); });

        // --- CONFIGURAÇÃO DA EMPRESA ---
        const CIDADE_FIXA = "Mossoró, Rio Grande do Norte, Brasil"; 
        const PRECO_BASE = 6.00;      // Taxa fixa de saída
        const PRECO_POR_KM = 1.80;    // Valor por Km
        const TAXA_RETORNO = 0.70;    // % do valor da ida para o retorno

        let distanciaFinal = 0;
        let valorFinal = 0;

        // Função de Cálculo de Distância (Nominatim API)
        async function calcularDistancia() {
            const origemInput = document.getElementById('origem').value;
            const destinoInput = document.getElementById('destino').value;

            if(!origemInput || !destinoInput) { alert("Digite os endereços de retirada e entrega!"); return; }

            // UI Loading
            document.getElementById('btn-text').innerText = "Buscando rotas...";
            document.getElementById('loading').classList.remove('hidden');

            try {
                // Adiciona a cidade fixa na busca automaticamente
                const buscaOrigem = `${origemInput}, ${CIDADE_FIXA}`;
                const buscaDestino = `${destinoInput}, ${CIDADE_FIXA}`;

                // 1. Busca coordenadas
                const resA = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaOrigem)}`);
                const dataA = await resA.json();
                const resB = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(buscaDestino)}`);
                const dataB = await resB.json();

                if(dataA.length === 0 || dataB.length === 0) {
                    alert("Endereço não encontrado no mapa. Tente adicionar o nome do bairro.");
                    resetBotao();
                    return;
                }

                // 2. Calcula KM
                const distanciaLinhaReta = getDistanceFromLatLonInKm(dataA[0].lat, dataA[0].lon, dataB[0].lat, dataB[0].lon);
                distanciaFinal = (distanciaLinhaReta * 1.3).toFixed(1); // +30% margem de erro
                if(distanciaFinal < 1) distanciaFinal = 1;

                recalcularTotal();

                // Mostra resultado
                document.getElementById('resultado-box').classList.remove('hidden');
                document.getElementById('btn-enviar').classList.remove('hidden');
                document.getElementById('resultado-box').classList.remove('animate-pulse');
                
            } catch (error) {
                alert("Erro de conexão. Verifique sua internet.");
            }
            resetBotao();
        }

        // Função Matemática de Preço
        function recalcularTotal() {
            if(distanciaFinal == 0) return;

            let preco = PRECO_BASE + (distanciaFinal * PRECO_POR_KM);
            
            // Verifica Retorno
            const temRetorno = document.getElementById('retorno').checked;
            if(temRetorno) {
                preco = preco + (preco * TAXA_RETORNO);
            }

            valorFinal = preco.toFixed(2);

            // Atualiza na tela
            document.getElementById('km-display').innerText = distanciaFinal.replace('.', ',');
            document.getElementById('valor-display').innerText = valorFinal.replace('.', ',');
        }

        // Função Visual do Botão Retorno
        function mudarStatusRetorno() {
            const isChecked = document.getElementById('retorno').checked;
            const box = document.getElementById('box-retorno');
            const text = document.getElementById('text-retorno');
            const icon = document.getElementById('icon-retorno');

            if(isChecked) {
                box.classList.replace('bg-gray-50', 'bg-blue-50');
                box.classList.replace('border-gray-100', 'border-blue-200');
                text.innerText = "Sim, com retorno";
                text.classList.replace('text-gray-500', 'text-blue-700');
                icon.className = "fas fa-exchange-alt text-blue-600 transition-colors duration-300";
            } else {
                box.classList.replace('bg-blue-50', 'bg-gray-50');
                box.classList.replace('border-blue-200', 'border-gray-100');
                text.innerText = "Precisa de retorno?";
                text.classList.replace('text-blue-700', 'text-gray-500');
                icon.className = "fas fa-arrow-right text-gray-400 transition-colors duration-300";
            }
        }

        // Resetar Botão
        function resetBotao() {
            document.getElementById('btn-text').innerText = "Recalcular Rota";
            document.getElementById('loading').classList.add('hidden');
        }

        // Fórmula de Haversine (Cálculo de Lat/Lon)
        function getDistanceFromLatLonInKm(lat1,lon1,lat2,lon2) {
            var R = 6371; var dLat = deg2rad(lat2-lat1); var dLon = deg2rad(lon2-lon1); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c; 
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }

        // Enviar WhatsApp
        function enviarPedido() {
            const nome = document.getElementById('nome').value;
            const origem = document.getElementById('origem').value;
            const destino = document.getElementById('destino').value;
            const pagamento = document.getElementById('pagamento').value;
            const temRetorno = document.getElementById('retorno').checked ? "SIM (Ida e Volta)" : "NÃO (Só ida)";
            
            // ATENÇÃO: COLOQUE SEU NÚMERO AQUI (DDD + NÚMERO)
            const numZap = "5584982005039"; 

            const texto = `*NOVA ENTREGA SOLICITADA* 🛵%0A%0A` +
                          `👤 *Cliente:* ${nome}%0A` +
                          `📍 *De:* ${origem} (Mossoró)%0A` +
                          `🏁 *Para:* ${destino} (Mossoró)%0A` +
                          `📏 *Distância:* ${distanciaFinal}km%0A` +
                          `🔄 *Retorno:* ${temRetorno}%0A` +
                          `💰 *Pagamento:* ${pagamento}%0A` +
                          `💲 *VALOR TOTAL:* R$ ${valorFinal}%0A%0A` +
                          `_Aguardo confirmação!_`;

            window.open(`https://wa.me/${numZap}?text=${texto}`, '_blank');
        }
    </script>
</body>
</html>
